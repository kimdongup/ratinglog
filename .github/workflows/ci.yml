name: Registry checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ratinglog_test
          POSTGRES_PASSWORD: temporary-ci-test-only
          POSTGRES_DB: ratinglog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ratinglog_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-non-production-secret-32-characters
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - name: SQLite regression suite
        run: pytest
      - name: PostgreSQL regression suite
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ratinglog_test:temporary-ci-test-only@127.0.0.1:5432/ratinglog_test
        run: pytest
      - name: Production guards and Redis
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ratinglog_test:temporary-ci-test-only@127.0.0.1:5432/ratinglog_test
        run: python scripts/production_smoke.py
      - name: Dependency audit
        if: matrix.python == '3.14'
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Browser installation
        if: matrix.python == '3.14'
        run: python -m playwright install --with-deps chromium
      - name: Browser workflow and responsive layout
        if: matrix.python == '3.14'
        run: python scripts/browser_smoke.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.python == '3.14'
        with:
          name: browser-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
